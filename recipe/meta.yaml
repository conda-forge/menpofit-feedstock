{% set name = "menpofit" %}
{% set version = "0.8.0" %}
# conda-forge builds Python 3.11-3.14, and menpo (>=0.12) needs 3.11; the noarch test
# environment is solved at python_min
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 45e36bb0f24d0b684ebc91395a48da8452f9135b0bcb515de099fbef727ee55a

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >={{ python_min }}
    - menpo >=0.12
    - numpy >=1.23
    - scipy >=1.6
    - pandas >=1.5
    - dlib

test:
  imports:
    - menpofit
    - menpofit.aam
    - menpofit.aps
    - menpofit.atm
    - menpofit.clm
    - menpofit.dlib
    - menpofit.error
    - menpofit.lk
    - menpofit.math
    - menpofit.sdm
    - menpofit.transform
    - menpofit.visualize
  requires:
    - python {{ python_min }}.*
    - pip
  commands:
    - pip check

about:
  home: https://github.com/menpo/menpofit
  dev_url: https://github.com/menpo/menpofit
  doc_url: https://menpofit.readthedocs.io/en/stable/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: A Menpo deformable modelling toolkit
  description: |
    The Menpo Project package for state-of-the-art 2D deformable modelling
    techniques including AAMs, SDMs, CLMs

extra:
  recipe-maintainers:
    - patricksnape
